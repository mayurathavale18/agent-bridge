spec:
  template:
    spec:
      containers:
        - name: serve
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            appArmorProfile:
              type: Localhost
              localhostProfile: agent-bridge-codex
