# agent-bridge on k3s — WhatsApp channel server from the published npm package.
#
# The OpenWA gateway (also in this namespace, see openwa.yaml) posts message webhooks to
# http://agent-bridge.agent-stack.svc:8788/webhook, and the bridge drives whichever harness
# AGENT_BRIDGE_HARNESS selects. OPENWA_BASE_URL points back at the in-cluster OpenWA service
# for outbound delivery, so no traffic leaves the cluster.
---
apiVersion: v1
kind: Namespace
metadata:
  name: agent-stack
---
apiVersion: v1
kind: Secret
metadata:
  name: agent-bridge-env
  namespace: agent-stack
stringData:
  OPENWA_BASE_URL: "http://openwa.agent-stack.svc.cluster.local:2785"
  OPENWA_API_KEY: "REPLACE_WITH_OPENWA_API_KEY"
  OPENWA_WEBHOOK_SECRET: "REPLACE_WITH_WEBHOOK_SECRET"
  OPENWA_SESSION_ID: "REPLACE_WITH_SESSION_ID"
  OPENWA_ALLOW_SELF_CHAT: "true"
  OPENWA_SELF_JID: "YOUR_PHONE@c.us,YOUR_LID@lid"
  OPENWA_ALLOWED_USERS: "YOUR_PHONE@c.us,YOUR_LID@lid"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-bridge
  namespace: agent-stack
  labels: { app: agent-bridge }
spec:
  replicas: 1
  selector:
    matchLabels: { app: agent-bridge }
  template:
    metadata:
      labels: { app: agent-bridge }
    spec:
      containers:
        - name: serve
          image: agent-bridge:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8788
          envFrom:
            - secretRef: { name: agent-bridge-env }
          readinessProbe:
            httpGet: { path: "/health", port: 8788 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: "/health", port: 8788 }
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: agent-bridge
  namespace: agent-stack
spec:
  selector: { app: agent-bridge }
  ports:
    - name: http
      port: 8788
      targetPort: 8788
