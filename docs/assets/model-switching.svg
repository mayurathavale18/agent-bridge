<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img">
<title>Model selection: controls differ by harness</title>
<style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;fill:#24292f;font-size:15px}.title{font-size:22px;font-weight:600}.label{font-size:17px;font-weight:600}.note{fill:#57606a;font-size:13px}</style>
<rect width="960" height="330" rx="8" fill="#fff"/>
<text x="28" y="40" class="title">Model selection: controls differ by harness</text>
<rect x="28.0" y="65" width="440.0" height="195" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="46.0" y="97" class="label">Hermes · WhatsApp commands</text>
<text x="46.0" y="132">@me /model</text>
<text x="46.0" y="157">list available provider models</text>
<text x="46.0" y="182">@me /model &lt;model-id&gt;</text>
<text x="46.0" y="207">select an ID from the list</text>

<rect x="492.0" y="65" width="440.0" height="195" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="510.0" y="97" class="label">cmd · bridge configuration</text>
<text x="510.0" y="132">Dashboard: Model</text>
<text x="510.0" y="157">or AGENT_BRIDGE_CMD__MODEL</text>
<text x="510.0" y="182">restart bridge to apply</text>
<text x="510.0" y="207">environment overrides saved values</text>
<text x="28" y="295" class="note">Use actual provider model IDs • credentials and availability depend on the provider • no /harness chat command</text>
</svg>
